name: Build and release Smoosher

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoosher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check version and tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=$(bash scripts/release-version.sh "$GITHUB_REF_NAME")
          else
            version=$(bash scripts/release-version.sh)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check release failure handling
        run: python3 -m unittest discover -s tests -v

  build:
    needs: version
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
          - name: Windows
            os: windows-2022
    env:
      SMOOSHER_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select release Xcode
        if: runner.os == 'macOS'
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Configure macOS universal build
        if: runner.os == 'macOS'
        run: >-
          cmake -S . -B build -G Xcode
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DSMOOSHER_COPY_PLUGIN_AFTER_BUILD=OFF
          -DSMOOSHER_BUILD_TESTS=ON
      - name: Configure Windows build
        if: runner.os == 'Windows'
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DSMOOSHER_COPY_PLUGIN_AFTER_BUILD=OFF -DSMOOSHER_BUILD_TESTS=ON
      - name: Build macOS plugins
        if: runner.os == 'macOS'
        run: cmake --build build --config Release --target Smoosher_AU Smoosher_VST3 SmoosherTests --parallel 3
      - name: Build Windows plugin
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --target Smoosher_VST3 SmoosherTests --parallel 4
      - name: Test processor, session compatibility, presets, and More Trouble
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Verify universal binaries and validate AU
        if: runner.os == 'macOS'
        run: |
          bash scripts/verify-macos.sh build/Smoosher_artefacts/Release
          codesign --force --sign - build/Smoosher_artefacts/Release/AU/Smoosher.component
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          ditto build/Smoosher_artefacts/Release/AU/Smoosher.component "$HOME/Library/Audio/Plug-Ins/Components/Smoosher.component"
          # TERM can leave the registrar running with stale discovery data.
          killall -9 -u "$(id -un)" AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -v aufx Smsh Smsh
      - name: Archive unsigned macOS bundles
        if: runner.os == 'macOS'
        run: |
          mkdir -p macos-payload/AU macos-payload/VST3 dist
          ditto build/Smoosher_artefacts/Release/AU/Smoosher.component macos-payload/AU/Smoosher.component
          ditto build/Smoosher_artefacts/Release/VST3/Smoosher.vst3 macos-payload/VST3/Smoosher.vst3
          ditto -c -k --keepParent macos-payload dist/Smoosher-macOS-unsigned.zip
      - name: Package Windows VST3
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p windows-payload/VST3 dist
          cp -R build/Smoosher_artefacts/Release/VST3/Smoosher.vst3 windows-payload/VST3/
          cp README.md windows-payload/
          cp -R docs windows-payload/
          (cd windows-payload && 7z a "../dist/Smoosher-$SMOOSHER_VERSION-Windows.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  sign-macos:
    # No signing environment or credentials are exposed to PR/branch builds.
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    needs: [version, build]
    runs-on: macos-15
    environment: macos-release
    timeout-minutes: 65
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: build-macOS
      - name: Extract unsigned bundles
        run: ditto -x -k Smoosher-macOS-unsigned.zip .
      - name: Sign, package, notarize, and staple
        env:
          MACOS_APPLICATION_P12_BASE64: ${{ secrets.MACOS_APPLICATION_P12_BASE64 }}
          MACOS_INSTALLER_P12_BASE64: ${{ secrets.MACOS_INSTALLER_P12_BASE64 }}
          MACOS_P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          MACOS_APPLICATION_IDENTITY: ${{ vars.MACOS_APPLICATION_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ vars.MACOS_INSTALLER_IDENTITY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash scripts/release-macos.sh macos-payload dist
      - name: Keep notarization diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-notarization-logs
          path: dist/notary-*.json
          if-no-files-found: ignore
      - name: Upload verified installer
        uses: actions/upload-artifact@v4
        with:
          name: release-macOS
          path: dist/*.pkg
          if-no-files-found: error

  draft-release:
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    needs: [version, build, sign-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-macOS
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: build-Windows
          path: release
      - name: Generate checksums
        working-directory: release
        run: sha256sum ./*.pkg ./*.zip > SHA256SUMS.txt
      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft > release-state.json 2>/dev/null; then
            if [[ "$(jq -r .isDraft release-state.json)" != true ]]; then
              echo 'Refusing to replace assets on a published release.' >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes --title "Smoosher $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" release/*.pkg release/*.zip release/SHA256SUMS.txt --clobber
